<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jeff Hutchings</title>
    <style>
        :root {
            --bg: #f7f7f5;
            --fg: #1b1b19;
            --muted: #6b6b66;
            --card: #ffffff;
            --border: #e2e2dd;
            --accent: #3a6ea5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16171a;
                --fg: #ececea;
                --muted: #9a9a95;
                --card: #1f2125;
                --border: #2e3136;
                --accent: #7aa7d9;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 4rem 1.25rem;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 .5rem;
            font-size: clamp(2rem, 6vw, 2.75rem);
            letter-spacing: -0.02em;
        }

        .intro {
            margin: 0 0 3rem;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }

        .card {
            display: block;
            padding: 1.5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: inherit;
            text-decoration: none;
            transition: transform .15s ease, border-color .15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .card h2 {
            margin: 0 0 .35rem;
            font-size: 1.15rem;
            color: var(--accent);
        }

        .card p {
            margin: 0;
            color: var(--muted);
            font-size: .95rem;
        }

        /* -- */

        #pi {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            padding: .25rem .4rem;
            background: none;
            border: 0;
            color: var(--muted);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.2rem;
            line-height: 1;
            opacity: .25;
            cursor: default;
            transition: opacity .2s ease;
        }

        #pi:hover { opacity: .4; }

        #backdoor {
            position: fixed;
            right: 1rem;
            bottom: 3rem;
            display: none;
            min-width: 220px;
            padding: .5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
            animation: rise .18s ease;
        }

        #backdoor.open { display: block; }

        #backdoor a {
            display: block;
            padding: .5rem .65rem;
            border-radius: 6px;
            color: var(--fg);
            font-size: .9rem;
            text-decoration: none;
        }

        #backdoor a:hover { background: var(--bg); }

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Hi there, I'm Jeff</h1>
    <p class="intro">I break things. Here's some of what I've built.</p>

    <div class="cards">
        <a class="card" href="/dad-jokes-site/">
            <h2>Dad Jokes</h2>
            <p>Groan-worthy jokes, on demand.</p>
        </a>
        <a class="card" href="/scripture-stories-site/">
            <h2>Scripture Stories</h2>
            <p>Stories from the scriptures.</p>
        </a>
        <a class="card" href="https://github.com/jbhutch">
            <h2>GitHub</h2>
            <p>Code, experiments, and the rest.</p>
        </a>
    </div>
</div>

<button id="pi" aria-hidden="true" tabindex="-1">&pi;</button>
<nav id="backdoor" aria-hidden="true">
    <a href="/awesome.html">Show Me Something Awesome</a>
    <a href="/wbgameshow/gameshow.html">Wood Badge Game Show</a>
    <a href="/scripturewars/">Scripture Wars</a>
</nav>

<script>
    (function () {
        var pi = document.getElementById('pi');
        var menu = document.getElementById('backdoor');

        // mousedown, not click: on macOS ctrl+click is a right-click and never fires click.
        pi.addEventListener('mousedown', function (e) {
            if (!e.ctrlKey || !e.shiftKey) return;
            e.preventDefault();
            e.stopPropagation();
            menu.classList.toggle('open');
        });

        pi.addEventListener('contextmenu', function (e) {
            if (e.ctrlKey && e.shiftKey) e.preventDefault();
        });

        document.addEventListener('mousedown', function (e) {
            if (!menu.contains(e.target) && e.target !== pi) menu.classList.remove('open');
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') menu.classList.remove('open');
        });
    })();
</script>
</body>
</html>
